apply_adaptive_scene:
  name: Apply Adaptive Scene or Activity
  description: Activate an Adaptive Scene, Home Assistant Scene, or Activity in a room with brightness dynamically scaled to the current Perceptive Lighting Deficit.
  fields:
    room_id:
      name: Room ID or Name
      description: The room area ID or friendly name (e.g., living_room).
      required: true
      example: "living_room"
      selector:
        text:
    scene:
      name: Scene or Activity
      description: The Adaptive Scene ID, HA Scene entity ID, friendly name (e.g., Chilling, Working, Film), or 'default'.
      required: true
      example: "activity_working"
      selector:
        text:

capture_adaptive_scene:
  name: Capture Current Lights as Adaptive Scene
  description: Snapshot the room's current light states alongside the current Perceptive Lighting Deficit as a reusable Adaptive Scene.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:
    name:
      name: Scene Name
      description: Display name for the new Adaptive Scene (e.g., Reading, Board Games).
      required: true
      example: "Reading"
      selector:
        text:
    activity:
      name: Base Activity Curve
      description: Optional perceptual activity curve to associate with this scene.
      required: false
      selector:
        select:
          options:
            - "relaxing"
            - "working"
            - "reading"
            - "film"
            - "sleep_prep"
            - "transit"
            - "bright_task"

delete_adaptive_scene:
  name: Delete Adaptive Scene
  description: Remove a captured Adaptive Scene from a room.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      selector:
        text:
    scene_id:
      name: Scene ID
      required: true
      selector:
        text:

lock_room:
  name: Lock Room Automation
  description: Hard-lock all presence and automatic lighting adjustments for a room until explicitly unlocked.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:

unlock_room:
  name: Unlock Room Automation
  description: Unlock automatic presence and Perceptive Lighting control for a room.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:

nudge_feel:
  name: Direct Brightness & Shedding Control (+ / -)
  description: Directly step room brightness up (+) or down (-) to 1% and then progressively shed one light source at a time, recording the resulting measured room lux after 5 seconds.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:
    direction:
      name: Direction
      required: true
      default: "more_light"
      selector:
        select:
          options:
            - "more_light"
            - "too_bright"
    step_pct:
      name: Step Size (%)
      required: false
      default: 10.0
      selector:
        number:
          min: 1.0
          max: 30.0
          step: 1.0

calibrate_feels_dark_now:
  name: "Calibrate: Room Feels Dark Now (Turn On)"
  description: One-tap teaching action that calibrates the room's turn-on lux threshold so current ambient lighting triggers supplemental light and turns lights ON immediately.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:

calibrate_feels_bright_now:
  name: "Calibrate: Room Feels Bright Enough Now (Turn Off)"
  description: One-tap teaching action that calibrates the room's turn-on lux threshold so current natural lighting feels bright enough without supplemental light and turns lights OFF immediately.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:

set_window_compass:
  name: Set Window Compass Direction
  description: Set the compass azimuth (0–360°) that the room's primary windows face.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:
    azimuth:
      name: Compass Azimuth (0–360°)
      required: true
      example: 180
      selector:
        number:
          min: 0
          max: 360
          step: 1
          unit_of_measurement: "°"

update_room_exclusions:
  name: Update Room Entity Blacklist
  description: Update the list of excluded entities for a room.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      selector:
        text:
    excluded_entities:
      name: Excluded Entities
      required: true
      selector:
        entity:
          multiple: true

relearn_history:
  name: Re-Learn Sensor Profiles from Recorder History
  description: Re-analyze the past 10 days of Home Assistant Recorder history for all outdoor and indoor illuminance sensors.

optimize_with_ai:
  name: "AI: Optimize Room Perceptual Model & Light Priority (Gemini / HA AI)"
  description: Analyze recorded user manual adjustments, calibration presses, and light fixture capabilities using Home Assistant's AI Task / Gemini integration (with local factorial fallback) to refine room thresholds, models, and progressive light-shedding order.
  fields:
    room_id:
      name: Room ID or Name (Optional)
      description: Leave empty to optimize all configured rooms, or specify a room (e.g., living_room).
      required: false
      example: "living_room"
      selector:
        text:

reset_room:
  name: Reset Room or All Rooms Calibration & Learned State
  description: Reset all learned thresholds, brightness targets, nudges, observations, and overrides for a specific room (or all rooms if room_id is omitted or 'all') back to clean defaults.
  fields:
    room_id:
      name: Room ID or Name (Optional, or 'all')
      description: Specify a room (e.g., utility) or 'all' (or leave empty) to reset all rooms.
      required: false
      example: "utility"
      selector:
        text:

update_room_config:
  name: Update Room Configuration (Sidebar UI)
  description: Live-update a room's operating mode, per-regime scenes, off-state scene overrides, turn-on thresholds, target brightness, scene triggers, light shedding priority order, or entity exclusions.
  fields:
    room_id:
      name: Room ID or Name
      required: true
      example: "living_room"
      selector:
        text:
    operating_mode:
      name: Operating Mode
      required: false
      selector:
        select:
          options:
            - "full_adaptive"
            - "simple_transit"
            - "sensor_only"
    light_priority_order:
      name: Light Shedding Priority Order (Shed 1st to Keep Last)
      required: false
      selector:
        object:
    light_order_locked:
      name: Lock Custom Light Order
      required: false
      selector:
        boolean:
    regime_configs:
      name: Per-Regime Scene & Threshold Configurations
      required: false
      selector:
        object:
    scene_triggers:
      name: Per-Regime Entity Scene Triggers
      required: false
      selector:
        object:
    excluded_entities:
      name: Excluded Entities
      required: false
      selector:
        object:

update_hub_config:
  name: Update Global Hub & Time-of-Day Regime Schedule
  description: Live-update the global Time-of-Day Regime Schedule (mode, start hours, solar elevations, weather gloom shift, smooth cross-fade minutes), weather entity, outdoor sensors, or add/remove rooms.
  fields:
    regime_schedule:
      name: Time-of-Day Regime Schedule & Factors
      required: false
      selector:
        object:
    weather_entity:
      name: Weather Entity
      required: false
      selector:
        entity:
          domain: weather
    outdoor_sensors:
      name: Outdoor Illuminance Sensors
      required: false
      selector:
        entity:
          domain: sensor
          device_class: illuminance
          multiple: true
    global_lock:
      name: Global Automation Lock
      required: false
      selector:
        boolean:
